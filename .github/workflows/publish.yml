name: Prepare website preview

on:
  push:
    branches: [main]
    paths:
      - 'navasardyan-am-FINAL-verified.zip'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navasardyan-preview
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website and adapt links for preview
        shell: bash
        run: |
          set -euo pipefail
          ZIP="navasardyan-am-FINAL-verified.zip"
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          SITE="$RUNNER_TEMP/navasardyan-preview"
          mkdir -p "$SITE"
          unzip -q "$ZIP" -d "$SITE"
          test -f "$SITE/index.html"
          SITE="$SITE" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          site = Path(os.environ["SITE"])
          base = "/alform-creator/navasardyan-am/preview"
          attr = re.compile(r"""(?P<attr>\b(?:href|src|action|poster)=)(?P<q>["'])/(?P<path>(?!/)[^"']*)(?P=q)""")
          def fix(m):
              path = m.group("path")
              if path == "" or path.endswith("/"):
                  path += "index.html"
              return m.group("attr") + m.group("q") + base + "/" + path + m.group("q")
          for page in site.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = attr.sub(fix, html)
              html = re.sub(r'<meta name="robots"[^>]*>', '<meta name="robots" content="noindex,nofollow">', html, flags=re.I)
              if '<meta name="robots" content="noindex,nofollow">' not in html:
                  html = html.replace("</head>", '<meta name="robots" content="noindex,nofollow"></head>', 1)
              page.write_text(html, encoding="utf-8")
          css = site / "assets" / "style.css"
          if css.exists():
              content = css.read_text(encoding="utf-8")
              content = content.replace("url(/assets/", "url(" + base + "/assets/")
              css.write_text(content, encoding="utf-8")
          (site / ".nojekyll").touch()
          (site / "robots.txt").write_text("User-agent: *\nDisallow: /\n", encoding="utf-8")
          PY

      - name: Publish extracted files to preview branch
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/navasardyan-preview"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview
          git rm -rf . >/dev/null || true
          cp -a "$SITE/." .
          git add -A
          git commit -m "Publish website files for external preview"
          git push --force origin HEAD:refs/heads/preview
